<!DOCTYPE html>
<html lang="es"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Inventario CIFPP</title>
    <link rel="icon" type="image/png" href="/Imagenes/logo_centro.png">
    <link rel="stylesheet" th:href="@{/css/estilos.css}"">
</head>
<body>
    <form id="modificar" th:action="${action}" method="post">
        <input type="hidden" name="id" th:value="${id}">
        <h1>Vas a modificar lo siguiente</h1>
        <div th:utext="${tabla}" class="ocultarBotones"></div> <br/>
        <p>Deje en blanco los valores que no quiere modificar</p>
        <div th:utext="${cuerpoFormulario}"></div>

        <div th:if="${formulario == 'usuario'}" sec:authorize="hasAuthority('ROLE_Administrador')">

            <label for="roles">Selecciona los roles:</label><br/>

            <label>Alumno</label>
            <input type="checkbox" name="roles" value="69f70becc23e838b55f5f49c"/>

            <label>Profesor</label>
            <input type="checkbox" name="roles" value="69f70be1c23e838b55f5f49b"/>

            <label>Administrador</label>
            <input type="checkbox" name="roles" value="69f4711e7c8e3da289478728"/><br/>
        </div>

        <button type="submit" th:text="'Modificar ' + ${formulario}"></button>
        <button><a href="/volverAInicio">Cancelar</a></button>
    </form>
</body>
</html>
