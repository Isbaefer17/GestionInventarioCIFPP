<!DOCTYPE html>
<html lang="es"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Inventario CIFPP</title>
    <link rel="icon" type="image/png" href="/Imagenes/logo_centro.png">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <h1>Objetos</h1>
    <div class="botones">
        <a href="#anyadirObjeto"><button>Añadir un objeto</button></a><br/>
        <a href="#buscarPorID"><button>Buscar por id</button></a><br/>
        <a href="/volverAInicio"><button>Volver a inicio</button></a><br/>
    </div>
    <div th:utext="${tabla}"></div>
    <div class="formularios">
        <form id="anyadirObjeto" action="/anyadirObjeto" method="post">
            <label for="idObjeto">Introduce el codigo del nuevo objeto:</label>
            <input type="text" name="codigo" placeholder="Id" required><br/>
            <label for="nombreObjeto">Introduce el nombre del nuevo objeto: </label>
            <input type="text" name="nombre" placeholder="Nombre" required><br/>
            <label for="opcionesTipo">Seleciona el tipo de Objeto: </label>
            <select name="tipo" th:utext="${selecionarTipos}" id="opcionesTipo"></select> <br/>
            <button type="submit">Crear objeto</button>
            <button><a href="/volverAInicio">Cancelar</a></button><br/>
        </form>
        
        <form id="buscarPorID" action="/buscarObjetoPorID" method="post">
            <label for="codigoObjeto">Introduce el código del objeto a buscar: </label>
            <input type="text" name="codigoObjeto" placeholder="Código" required><br/>
            <button type="submit">Buscar objeto</button>
            <button><a href="/volverAInicio">Cancelar</a></button><br/>
        </form>
    </div>
</body>
</html>
