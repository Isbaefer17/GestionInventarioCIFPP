<!DOCTYPE html>
<html lang="es"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Inventario CIFPP</title>
    <link rel="icon" type="image/png" href="/Imagenes/logo_centro.png">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script>
    function validarRoles() {
        const checkboxes = document.querySelectorAll('input[name="roles"]');
        for (const cb of checkboxes) {
            if (cb.checked) return true; // comprobamos si al menos un rol está selecionado
        }
        alert("Debes seleccionar al menos un rol");
        return false; // Bloquea el envío del formulario
}
</script>
</head>
<body>
    <h1>Roles</h1>
    <div class="botones">
        <a href="#anyadirUsuario"><button>Añadir un Usuario</button></a><br/>
        <a href="#buscarPorID"><button>Buscar por id</button></a><br/>
        <a href="/volverAInicio"><button>Volver a inicio</button></a><br/>
    </div>
    <div th:utext="${tabla}"></div>
    <div class="formularios">
        <form id="anyadirUsuario" action="/anyadirUsuario" method="post" onsubmit="return validarRoles()">
            <label for="codigo">Introduce el codigo del nuevo usuario:</label>
            <input type="text" name="codigo" placeholder="Id" required><br/>
            
            <label for="nombre">Introduce el nombre del nuevo usuario: </label>
            <input type="text" name="nombre" placeholder="Nombre" required><br/>
            
            <label for="apellido">Introduce el apellido del nuevo usuario: </label>
            <input type="text" name="apellido" placeholder="Apellido" required><br/>

            <label for="correo">Introduce la correo del nuevo usuario: </label>
            <input type="email" name="correo" placeholder="Correo" required><br/>

            <label for="contrasenya">Introduce la contraseña del nuevo usuario: </label>
            <input type="text" name="contrasenya" placeholder="Contraseña" required><br/>

            <label for="confirmarContrasenya">Confirma tu contraseña: </label>
            <input type="text" name="confirmarContrasenya" placeholder="Confirmar contraseña" required><br/>

            <label for="roles">Seleciona los roles: </label><br/>

            <label for="roles"> Alumno:  </label>
            <input type="checkbox" name="roles" value="69f70becc23e838b55f5f49c"/> 
            <label for="roles"> Profesor: </label>
            <input type="checkbox" name="roles" value="69f70be1c23e838b55f5f49b"/>
            <label for="roles"> Administrador: </label>
            <input type="checkbox" name="roles" value="69f4711e7c8e3da289478728" /> <br/>

            <button type="submit">Crear usuario</button>
            <button><a href="/volverAInicio">Cancelar</a></button><br/>
        </form>

        <form id="buscarPorID" action="/buscarUsuarioPorID" method="post">
            <label for="codigoObjeto">Introduce el código del usuario a buscar: </label>
            <input type="text" name="codigoUsuario" placeholder="Código" required><br/>
            <button type="submit">Buscar Usuario</button>
            <button><a href="/volverAInicio">Cancelar</a></button><br/>
        </form>
    </div>
</body>
</html>
