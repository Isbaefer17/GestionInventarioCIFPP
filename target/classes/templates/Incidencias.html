<!DOCTYPE html>
<html lang="es"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Inventario CIFPP</title>
    <link rel="icon" type="image/png" href="/Imagenes/logo_centro.png">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <h1>Incidencia</h1>
    <div class="botones">
        <a href="#anyadirIncidencia"><button>Añadir una Incidencia</button></a>
        <div sec:authorize="hasRole('Administrador')">
            <a href="#buscarPorID"><button>Buscar por id</button></a> 
            <a href="#buscarPorEstado"><button>Buscar por estado</button></a>  
        </div>
        <a href="/volverAInicio"><button>Volver a inicio</button></a><br/>
    </div>
    <div th:utext="${tabla}" sec:authorize="hasRole('Administrador')"></div>
    <div class="formularios">
        <form id="anyadirIncidencia" action="/anyadirIncidencia" method="post">
            <label for="ususarioQueReporta">Introduce el codigo del usuario que reporta la incidencia:</label>
            <input type="text" name="usuarioId" placeholder="Id Usuario" required><br/>
            <label for="objetoReportado">Introduce el codigo del objeto reportado en la incidencia: </label>
            <input type="text" name="objetoId" placeholder="Id Objeto" required><br/>
            <label for="motivo">Escribe la descripción de la incidencia: </label>
            <input type="text" name="descripcion" placeholder="descipción de la incidencia" requiered><br/>
            <button type="submit">Crear Incidencia</button>
            <button><a href="/volverAInicio">Cancelar</a></button><br/>
        </form>
        
        <div sec:authorize="hasRole('Administrador')">
            <form id="buscarPorID" action="/buscarIncidenciaPorID" method="post">
                <label for="codigoObjeto">Introduce el código de la incidencia a buscar: </label>
                <input type="text" name="codigoIncidencia" placeholder="Código" required><br/>
                <button type="submit">Buscar Incidencia</button>
                <button><a href="/volverAInicio">Cancelar</a></button><br/>
            </form>

            <form id="buscarPorEstado" action="/buscarPorEstado" method="post">
                <select name="estadoId" th:utext="${selecionarEstados}" id="opcionesEstado"></select> <br/>
                <button type="submit">Buscar por Estado</button>
                <button><a href="/volverAInicio">Cancelar</a></button><br/>
            </form>
        </div>
    </div>
</body>
</html>
